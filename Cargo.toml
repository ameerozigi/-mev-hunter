[package]
name = "mev-hunter"
version = "0.1.0"
edition = "2021"
description = "A lightweight MEV bot simulation framework designed to monitor mempool data and calculate cross-DEX arbitrage opportunities."

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["macros"] }
rust_decimal_macros = "1.36"
url = "2.5"

[dev-dependencies]